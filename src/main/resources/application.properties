spring.application.name=food-order-management-service

springdoc.default-consumes-media-type=application/x-yaml;charset=UTF-8
springdoc.default-produces-media-type=application/x-yaml;charset=UTF-8
springdoc.swagger-ui.url=/docs/swagger.yaml
springdoc.swagger-ui.path=/docs/swagger

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT
jwt.secret.key=${JWT_SECRET_KEY}

# Google AI Studio
google.api.key=${GOOGLE_AP_KEY}

# multipart
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB